<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3f4ef">
<title>SudsQueue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&display=swap">
<style>
:root{--bg:#e3f4ef;--card:#fff;--ink:#17294a;--mut:#5b6b88;--line:#cfe6e0;--body:#f6fbfa;--glass:#eaf7ff;--free:#16845a;--res:#a86f00;--run:#2b6fd6;--fin:#c93c58;--bad:#6b7488;--acc:#2b6fd6;--cork:#e8c99a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c2e;--card:#182841;--ink:#e8f0ff;--mut:#9fb0cc;--line:#2a3d5c;--body:#1d3050;--glass:#12263f;--free:#4fd69c;--res:#ffc531;--run:#6aa8ff;--fin:#ff7a90;--bad:#98a2b8;--acc:#6aa8ff;--cork:#6b5232}}
:root[data-theme="dark"]{--bg:#0f1c2e;--card:#182841;--ink:#e8f0ff;--mut:#9fb0cc;--line:#2a3d5c;--body:#1d3050;--glass:#12263f;--free:#4fd69c;--res:#ffc531;--run:#6aa8ff;--fin:#ff7a90;--bad:#98a2b8;--acc:#6aa8ff;--cork:#6b5232}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;touch-action:manipulation;overflow-x:hidden}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;margin:0}
button{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.sm{min-height:44px;padding:0 12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--res);outline-offset:2px}
input{font:inherit;font-size:16px;min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles i{position:absolute;bottom:-60px;border-radius:50%;border:2px solid #fff8;background:#ffffff40;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
header,main,nav{position:relative;z-index:1}
header{display:flex;align-items:center;gap:8px;padding:12px 16px}
header h1{font-size:28px;font-weight:700;flex:1;letter-spacing:-.5px}
header button{padding:0;width:44px;background:var(--card);color:var(--ink);font-size:18px}
.live{font-size:13px;font-weight:700;color:var(--free)}.live.off{color:var(--fin)}
main{padding:0 16px 96px;max-width:1100px;margin:0 auto}
body.tab-room #chatPane,body.tab-chat #roomPane{display:none}
#chatPane{flex-direction:column;height:calc(100dvh - 190px);min-height:380px}
body.tab-chat #chatPane{display:flex}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line);z-index:5}
.tabs button{flex:1;background:transparent;color:var(--mut)}
body.tab-room .tabs [data-v=room],body.tab-chat .tabs [data-v=chat]{background:var(--acc);color:#fff}
@media(min-width:900px){main{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
body.tab-room #chatPane,body.tab-chat #roomPane{display:block}body #chatPane{display:flex;position:sticky;top:12px;height:calc(100dvh - 90px)}.tabs{display:none}}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
.me{border:3px solid var(--acc)}.me.turn{border-color:var(--res);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ffc53155}}
.big{font:700 44px/1 Fredoka,sans-serif;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
.sec h2{font-size:22px}
.q{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{padding:4px 10px;border-radius:99px;background:var(--bg);font-size:14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.m{background:var(--card);border-radius:20px;padding:12px;border:3px solid var(--line);display:flex;gap:12px}
.m.free{border-color:var(--free)}.m.reserved{border-color:var(--res)}.m.running{border-color:var(--run)}.m.finished{border-color:var(--fin)}.m.broken{border-color:var(--bad);opacity:.85}
.m .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.st{font-weight:700;font-size:14px}
.free .st{color:var(--free)}.reserved .st{color:var(--res)}.running .st{color:var(--run)}.finished .st{color:var(--fin)}.broken .st{color:var(--bad)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:var(--run)}
.mc{width:78px;height:auto;flex:none}
.spin{animation:spin 2.2s linear infinite;transform-origin:60px 80px;transform-box:view-box}
.wave{animation:wave 1.6s ease-in-out infinite alternate}
.ring{animation:ringp 1.1s ease-in-out infinite;transform-origin:60px 80px;transform-box:view-box}
.finished .door{animation:pop 1.4s ease-in-out infinite;transform-origin:60px 80px;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes wave{to{transform:translateY(-6px)}}
@keyframes ringp{50%{transform:scale(1.07);opacity:.5}}@keyframes pop{50%{transform:scale(1.05)}}
.m .acts{display:flex;gap:6px;flex-wrap:wrap}
#chatPane{background:var(--cork);border-radius:22px;padding:12px;gap:8px}
#pins .note{background:#fff3a3;color:#3b3200;padding:8px 10px;border-radius:4px;margin-bottom:6px;transform:rotate(-1deg);box-shadow:0 3px 6px #0003;font-weight:700}
#pins .note small{display:block;font-weight:400}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.msg{background:var(--card);padding:6px 12px;border-radius:16px 16px 16px 4px;max-width:88%;align-self:flex-start;word-wrap:break-word}
.msg.mine{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--acc);color:#fff}.msg.mine small{color:#fffc}
.msg p{margin:0}.msg small{color:var(--mut)}
.sys{align-self:center;font-size:13px;background:#0002;color:var(--ink);padding:2px 10px;border-radius:99px;text-align:center}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}.modal .card{width:100%;max-width:420px;margin:0;display:flex;flex-direction:column;gap:12px}
.pick button{background:var(--bg);color:var(--ink);padding:0 12px}.pick button.on{background:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:30;display:none;max-width:90%;text-align:center}
.badge{background:var(--fin);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body class="tab-room">
<div class="bubbles" aria-hidden="true"></div>
<header><h1>🫧 SudsQueue</h1><span id="live" class="live off">● Connecting</span>
<button data-a="mute" id="mutebtn" aria-label="Toggle sound">🔔</button><button data-a="theme" aria-label="Toggle dark mode">🌓</button><button data-a="demo" aria-label="Demo: skip 5 minutes" title="Demo: skip 5 min">⏩</button></header>
<main>
<section id="roomPane"><div id="me"></div><div id="washers" class="sec"></div><div id="dryers" class="sec"></div></section>
<section id="chatPane" aria-label="Dorm board"><div id="pins"></div><div id="msgs"></div>
<div class="row"><input id="msgIn" maxlength="280" placeholder="Say something to the dorm" style="flex:1"><button data-a="send">Send</button><button class="ghost sm" data-a="pin" title="Pin to board" aria-label="Pin to board">📌</button></div></section>
</main>
<nav class="tabs"><button data-a="tab" data-v="room">🧺 Laundry</button><button data-a="tab" data-v="chat">💬 Board <b id="unread" class="badge" hidden></b></button></nav>

<div class="modal" id="welcome"><div class="card"><h2>Welcome to the laundry room</h2><p class="mut">Pick a name and an avatar. Others will see them in the queue and chat.</p>
<input id="nameIn" maxlength="20" placeholder="Display name (2–20 characters)" autocomplete="nickname"><div class="row pick" id="emojis"></div><button data-a="enter">Enter the laundry room</button></div></div>
<div class="modal" id="join"><div class="card"><h2 id="jt">Join the line</h2><input id="jname" maxlength="20" placeholder="Display name">
<div class="mut">How long will you use it? (15–180 min)</div><div class="row pick" id="presets"></div><input id="jest" type="number" min="15" max="180" inputmode="numeric" placeholder="Custom minutes">
<p class="mut" id="jnote"></p><div class="row"><button data-a="joinGo" style="flex:1">Join the line</button><button class="ghost" data-a="close">Cancel</button></div></div></div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),MIN=6e4,WIN=10*MIN;
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let me=lsGet('sq_me'),muted=!!lsGet('sq_mute'),S=null,V=null,ref,chat,msgs=[],jType='washer',jEst=45,seenAt=Date.now(),lastSend=0,alerted={},actx,pend=false,flash;
const EMO=['🦊','🐙','🐸','🦉','🐼','🐯','🦄','🐧'];
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1e3);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function clear(m){Object.assign(m,{state:'free',owner:null,until:null,endsAt:null,finishedAt:null,startedAt:null,est:null,ext:0,confirms:[],note:null})}
const defaults=()=>({queue:[],machines:[['w1','washer','Washer 1'],['w2','washer','Washer 2'],['w3','washer','Washer 3'],['d1','dryer','Dryer 1'],['d2','dryer','Dryer 2']].map(([id,type,label])=>{const m={id,type,label};clear(m);return m})});
function tick(s,now,log){let ch=false,again=true;
 while(again){again=false;
  for(const m of s.machines){
   if(m.state==='running'&&now>=m.endsAt){m.state='finished';m.finishedAt=m.endsAt;m.confirms=[];log.push(m.owner.name+'’s laundry in '+m.label+' is done 🔔');ch=again=true}
   else if(m.state==='reserved'&&now>=m.until){const o=m.owner;log.push(o.name+' missed their turn and went to the back of the line');s.queue.push({id:rid(),uid:o.uid,name:o.name,emoji:o.emoji,type:m.type,est:m.est,joinedAt:now,missed:(o.missed||0)+1});clear(m);ch=again=true}
   if(m.state==='free'){const i=s.queue.findIndex(q=>q.type===m.type);
    if(i>-1){const q=s.queue.splice(i,1)[0];Object.assign(m,{state:'reserved',owner:{uid:q.uid,name:q.name,emoji:q.emoji,missed:q.missed||0},est:q.est,until:now+WIN,ext:0,confirms:[]});log.push(q.name+' is up! '+m.label+' is reserved for 10 minutes');ch=again=true}}
  }}
 return ch}
const mine=m=>m.owner&&me&&m.owner.uid===me.uid;
const busy=(s,t)=>s.queue.some(q=>q.uid===me.uid&&q.type===t)||s.machines.some(m=>m.type===t&&mine(m));
async function mutate(fn){
 try{const snap=await ref.get();const s=snap.exists?snap.data():defaults();s.queue=s.queue||[];const log=[],now=Date.now();
  tick(s,now,log);const err=fn&&fn(s,now,log);if(err){toast(err);return}
  tick(s,now,log);await ref.set(s);S=s;render();log.forEach(say)}
 catch(e){toast('Couldn’t save. Check your connection and try again.')}}
const say=text=>chat&&chat.add({kind:'sys',text,at:Date.now(),uid:'sys',name:'',emoji:''}).catch(()=>{});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}

function svg(m){const d=m.type==='dryer',st=m.state,col={free:'#16a06a',reserved:'#e8a100',running:d?'#ff8a1f':'#2b7de9',finished:'#e0526b',broken:'#7b8498'}[st];
 const items=st==='running'?`<g class="spin"><rect x="44" y="62" width="14" height="24" rx="6" fill="${d?'#ff8a1f':'#ff6b9d'}"/><circle cx="74" cy="70" r="8" fill="#ffd166"/><rect x="56" y="84" width="22" height="10" rx="5" fill="${d?'#e8590c':'#7cc6fe'}"/><path d="M48 96h10l-3 12z" fill="${d?'#ffb86b':'#fff'}"/></g>`:'';
 const water=st==='running'&&!d?'<path class="wave" d="M20 86q8-6 16 0t16 0t16 0t16 0t16 0v30H20z" fill="#7cc6fe" opacity=".6"/>':'';
 return `<svg class="mc" viewBox="0 0 120 140" role="img" aria-label="${m.label}"><rect x="4" y="4" width="112" height="132" rx="18" fill="var(--body)" stroke="${col}" stroke-width="4"/><circle cx="24" cy="22" r="6" fill="${col}"/><rect x="40" y="17" width="48" height="10" rx="5" fill="var(--line)"/>
 <g class="door"><circle cx="60" cy="80" r="42" fill="var(--glass)" stroke="${col}" stroke-width="5"/></g><clipPath id="c${m.id}"><circle cx="60" cy="80" r="37"/></clipPath><g clip-path="url(#c${m.id})">${water}${items}</g>
 ${st==='reserved'?'<circle class="ring" cx="60" cy="80" r="47" fill="none" stroke="#e8a100" stroke-width="4"/>':''}
 ${st==='finished'?'<text x="60" y="87" text-anchor="middle" font-size="22" font-weight="700" fill="#e0526b" font-family="Fredoka,sans-serif">Ding!</text>':''}
 ${st==='free'?'<circle cx="60" cy="80" r="47" fill="none" stroke="#16a06a" stroke-opacity=".35" stroke-width="6"/>':''}
 ${st==='broken'?'<g transform="rotate(-12 60 80)"><rect x="-6" y="66" width="132" height="26" fill="#ffd54a"/><text x="60" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#333" font-family="Fredoka,sans-serif">OOPS</text></g>':''}</svg>`}

const LBL={free:'✅ Free',reserved:'⏳ Reserved',running:d=>'🌀 Running',finished:'🔔 Done, clothes inside?',broken:'🚧 Out of order'};
function mach(m,s,now){let det='',acts='';const nq=s.queue.filter(q=>q.type===m.type).length;
 if(m.state==='free')det='Empty and ready.';
 if(m.state==='reserved'){det=`${m.owner.emoji} ${esc(m.owner.name)}’s turn · ${mmss(m.until-now)} left to start`;}
 if(m.state==='running'){const tot=m.endsAt-m.startedAt,p=Math.min(100,(now-m.startedAt)/tot*100);det=`${m.owner.emoji} ${esc(m.owner.name)} · ${mmss(m.endsAt-now)} left · ready ${hm(m.endsAt)}<div class="bar"><b style="width:${p}%"></b></div>`}
 if(m.state==='finished'){const w=now-m.finishedAt;det=`${m.owner.emoji} ${esc(m.owner.name)} · waiting ${Math.floor(w/MIN)} min`;
  if(w>=WIN&&nq&&!mine(m))acts+=`<button class="sm ghost" data-a="out" data-id="${m.id}">Clothes are out (${(m.confirms||[]).length}/2)</button>`}
 if(m.state==='broken')det=esc(m.note||'Reported broken');
 if(m.state==='broken')acts+=`<button class="sm ghost" data-a="fix" data-id="${m.id}">Mark fixed</button>`;
 else acts+=`<button class="sm ghost" data-a="bad" data-id="${m.id}" aria-label="Report a problem with ${m.label}">⚠️ Report</button>`;
 const L={free:'✅ Free',reserved:'⏳ Reserved',running:'🌀 Running',finished:'🔔 Done',broken:'🚧 Out of order'}[m.state];
 return `<div class="m ${m.state}">${svg(m)}<div class="t"><h3>${m.label}</h3><div class="st">${L}</div><div class="mut">${det}</div><div class="acts">${acts}</div></div></div>`}

function sect(s,type,now){const ms=s.machines.filter(m=>m.type===type),q=s.queue.filter(x=>x.type===type),fr=ms.filter(m=>m.state==='free').length,t=type==='washer'?'🫧 Washers':'🔥 Dryers';
 const can=me&&!busy(s,type);
 return `<div class="card"><div class="row sp"><h2>${t}</h2><span class="mut">${fr} of ${ms.length} free</span></div>
 <div class="q">${q.length?q.map((x,i)=>`<span class="chip">#${i+1} ${x.emoji} ${esc(x.name)} · ${x.est}m${x.missed?' 😴':''}</span>`).join(''):'<span class="mut">No one’s in line. Your socks are safe. 🧦</span>'}</div>
 <div class="grid">${ms.map(m=>mach(m,s,now)).join('')}</div>
 ${can?`<p><button data-a="join" data-v="${type}">${fr&&!q.length?'Claim one now':'Join the line'}</button></p>`:''}</div>`}

function status(s,now){if(!me)return'';
 const my=s.machines.find(m=>mine(m)&&m.state!=='free'),qi=s.queue.findIndex(q=>q.uid===me.uid);let h,cls='';
 if(my&&my.state==='reserved'){cls='turn';h=`<h2>🎉 It’s your turn: ${my.label}</h2><div class="big">${mmss(my.until-now)}</div><p class="mut">Load your clothes, then press start.</p><div class="row"><button data-a="start" data-id="${my.id}">I’ve loaded it, start!</button>${my.ext?'':`<button class="ghost" data-a="ext" data-id="${my.id}">I need 5 more minutes</button>`}</div>`}
 else if(my&&my.state==='running')h=`<h2>${my.label} is running</h2><div class="big">${mmss(my.endsAt-now)}</div><p class="mut">Ready around ${hm(my.endsAt)}</p><div class="row"><button class="ghost" data-a="plus" data-id="${my.id}" data-v="5">+5 min</button><button class="ghost" data-a="plus" data-id="${my.id}" data-v="10">+10 min</button><button class="ghost" data-a="free" data-id="${my.id}">Finished early</button></div>`;
 else if(my&&my.state==='finished'){cls='turn';h=`<h2>🔔 Your laundry is done</h2><p class="mut">${my.label} is waiting for you.</p><button data-a="free" data-id="${my.id}">I’ve collected my stuff</button>`}
 else if(qi>-1){const q=s.queue[qi];h=`<h2>You are #${qi+1} in the ${q.type} line</h2><p class="mut">${q.est} min cycle. Keep this page open: you get 10 minutes once it’s your turn.</p><button class="ghost" data-a="leave" data-id="${q.id}">Leave the line</button>`}
 else h=`<h2>${me.emoji} Hi ${esc(me.name)}</h2><p class="mut">You’re not in any line. Pick a machine type below.</p>`;
 return `<div class="card me ${cls}">${h}</div>`}

function render(){if(!S||!me)return;const now=Date.now();V=structuredClone(S);V.queue=V.queue||[];tick(V,now,[]);
 $('#me').innerHTML=status(V,now);$('#washers').innerHTML=sect(V,'washer',now);$('#dryers').innerHTML=sect(V,'dryer',now);
 $('#live').textContent='● Live';$('#live').className='live';
 const m=V.machines.find(x=>mine(x)&&x.state==='reserved'),k=m&&m.id+m.until;
 if(m&&!alerted[k]){alerted[k]=1;turnAlert(m)}
 const f=V.machines.find(x=>mine(x)&&x.state==='finished'),k2=f&&f.id+'f'+f.finishedAt;if(f&&!alerted[k2]){alerted[k2]=1;beep();notify('Your laundry is done!',f.label+' is waiting for you.')}}
function turnAlert(m){toast('It’s your turn! '+m.label+' is reserved for you.');beep();notify('It’s your turn!','You have 10 minutes to start '+m.label);
 clearInterval(flash);const t=document.title;let on=0;flash=setInterval(()=>{if(!document.hidden||!V||!V.machines.some(x=>mine(x)&&x.state==='reserved')){clearInterval(flash);document.title=t;return}document.title=(on^=1)?'🔔 YOUR TURN!':t},900)}
function notify(t,b){try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification(t,{body:b})}catch(e){}}
function beep(){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5);o.start();o.stop(actx.currentTime+.5);navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

function renderChat(){if(!me)return;const pins=msgs.filter(m=>m.kind==='pin'&&Date.now()-m.at<864e5).slice(-3);
 $('#pins').innerHTML=pins.map(m=>`<div class="note">📌 ${esc(m.text)}<small>${m.emoji} ${esc(m.name)}</small></div>`).join('');
 const box=$('#msgs'),atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<80;
 box.innerHTML=msgs.map(m=>m.kind==='sys'?`<div class="sys">${esc(m.text)}</div>`:`<div class="msg ${m.uid===me.uid?'mine':''}"><small>${m.emoji} ${esc(m.name)} · ${hm(m.at)}</small><p>${esc(m.text)}</p></div>`).join('');
 if(atEnd||document.body.classList.contains('tab-chat'))box.scrollTop=box.scrollHeight;
 const n=document.body.classList.contains('tab-chat')?0:msgs.filter(m=>m.at>seenAt&&m.uid!==me.uid&&m.kind!=='sys').length;const u=$('#unread');u.hidden=!n;u.textContent=n}
function send(pin){const i=$('#msgIn'),t=i.value.trim();if(!t)return;if(Date.now()-lastSend<2000)return toast('Slow down a little.');lastSend=Date.now();
 chat.add({kind:pin?'pin':'msg',text:t.slice(0,280),at:Date.now(),uid:me.uid,name:me.name,emoji:me.emoji}).catch(()=>toast('Couldn’t send. Try again.'));i.value=''}

function openJoin(t){jType=t;jEst=45;$('#jt').textContent='Join the '+t+' line';$('#jname').value=me.name;$('#jest').value='';
 $('#jnote').textContent='Alerts only work while this page is open. If you can, allow notifications when asked.';
 $('#presets').innerHTML=[30,45,60,90].map(n=>`<button data-a="preset" data-v="${n}" class="${n===45?'on':''}">${n} min</button>`).join('');$('#join').classList.add('on')}
function act(a,id,v){
 if(a==='tab'){document.body.className='tab-'+v;if(v==='chat'){seenAt=Date.now();renderChat()}else render();return}
 if(a==='theme'){const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0f1c2e';d.dataset.theme=dark?'light':'dark';return}
 if(a==='mute'){muted=!muted;lsSet('sq_mute',muted);$('#mutebtn').textContent=muted?'🔕':'🔔';if(!muted)beep();return}
 if(a==='send')return send(false);if(a==='pin')return send(true);
 if(a==='enter'){const n=$('#nameIn').value.trim();if(n.length<2)return toast('Pick a name with 2–20 characters.');me={uid:rid(),name:n.slice(0,20),emoji:$('#emojis .on').textContent};lsSet('sq_me',me);$('#welcome').classList.remove('on');beep();render();renderChat();return}
 if(a==='close')return $('#join').classList.remove('on');
 if(a==='join')return openJoin(v);
 if(a==='preset'){jEst=+v;$('#jest').value='';document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));return}
 if(a==='joinGo'){const n=$('#jname').value.trim(),c=$('#jest').value;const est=c?+c:jEst;
  if(n.length<2)return toast('Pick a name with 2–20 characters.');if(!(est>=15&&est<=180))return toast('Choose between 15 and 180 minutes.');
  me.name=n.slice(0,20);lsSet('sq_me',me);beep();try{'Notification' in window&&Notification.permission==='default'&&Notification.requestPermission()}catch(e){}
  $('#join').classList.remove('on');
  return mutate((s,now,log)=>{if(busy(s,jType))return'You already have a spot for a '+jType+'.';
   const nm=me.name.toLowerCase();if(s.queue.some(q=>q.uid!==me.uid&&q.name.toLowerCase()===nm)||s.machines.some(m=>m.owner&&m.owner.uid!==me.uid&&m.owner.name.toLowerCase()===nm))return'Someone active already uses that name. Pick another.';
   s.queue.push({id:rid(),uid:me.uid,name:me.name,emoji:me.emoji,type:jType,est,joinedAt:now,missed:0});log.push(me.name+' joined the '+jType+' line')})}
 if(a==='demo'){return mutate(s=>{s.machines.forEach(m=>['until','endsAt','finishedAt','startedAt'].forEach(k=>{if(m[k])m[k]-=5*MIN}));toast('Skipped 5 minutes (demo)')})}
 mutate((s,now,log)=>{const m=s.machines.find(x=>x.id===id);
  if(a==='leave'){const i=s.queue.findIndex(q=>q.id===id);if(i<0||s.queue[i].uid!==me.uid)return'Already removed.';s.queue.splice(i,1);return}
  if(!m)return;
  if(a==='start'){if(m.state!=='reserved'||!mine(m))return'That turn is no longer yours.';Object.assign(m,{state:'running',startedAt:now,endsAt:now+m.est*MIN});log.push(m.owner.name+' started '+m.label+' ('+m.est+' min)')}
  if(a==='ext'){if(m.state!=='reserved'||!mine(m)||m.ext)return'No extension available.';m.until+=5*MIN;m.ext=1}
  if(a==='plus'){if(m.state!=='running'||!mine(m))return'Not running.';m.endsAt+=+v*MIN;if(m.endsAt-m.startedAt>(m.est+15)*MIN)log.push(m.owner.name+' extended '+m.label+' to '+hm(m.endsAt))}
  if(a==='free'){if(!mine(m))return'Not your machine.';log.push(m.label+' is free');clear(m)}
  if(a==='out'){if(m.state!=='finished'||mine(m))return;m.confirms=m.confirms||[];if(m.confirms.includes(me.uid))return'You already confirmed. One more person needed.';m.confirms.push(me.uid);
   if(m.confirms.length>=2){log.push(m.label+' was cleared after being left for 10+ minutes');clear(m)}else return'Thanks! One more confirmation from someone else frees it.'}
  if(a==='bad'){const o=m.owner;if(o&&(m.state==='running'||m.state==='reserved')&&o.uid){s.queue.unshift({id:rid(),uid:o.uid,name:o.name,emoji:o.emoji,type:m.type,est:m.est,joinedAt:now,missed:0})}
   clear(m);m.state='broken';m.note='Reported by '+me.name;log.push(me.name+' reported '+m.label+' as out of order'+(o?'. '+o.name+' moves to the front of the line':''))}
  if(a==='fix'){clear(m);log.push(m.label+' is back in service')}})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.id,b.dataset.v)});
$('#msgIn').addEventListener('keydown',e=>{if(e.key==='Enter')send(false)});
$('#jest').addEventListener('input',()=>document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('on')));
$('#emojis').innerHTML=EMO.map((e,i)=>`<button class="${i?'':'on'}" type="button" aria-label="Avatar ${e}">${e}</button>`).join('');
$('#emojis').addEventListener('click',e=>{if(e.target.matches('button')){document.querySelectorAll('#emojis button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on')}});
$('#mutebtn').textContent=muted?'🔕':'🔔';
$('.bubbles').innerHTML=Array.from({length:9},(_,i)=>`<i style="left:${i*11+3}%;width:${16+i%4*10}px;height:${16+i%4*10}px;animation-duration:${14+i*3}s;animation-delay:-${i*2}s"></i>`).join('');
if(!me)$('#welcome').classList.add('on');
['visibilitychange','focus','online'].forEach(ev=>addEventListener(ev,()=>{if(!document.hidden)render()}));
setInterval(()=>{if(!S||!me)return;render();const c=structuredClone(S);c.queue=c.queue||[];if(tick(c,Date.now(),[])&&!pend){pend=true;setTimeout(()=>{pend=false;mutate()},Math.random()*1500)}},1000);

(async()=>{let t=setTimeout(()=>{$('#live').textContent='● Can’t connect';$('#me').innerHTML='<div class="card">Shared storage isn’t available. Open this page while signed in to claude.ai and ask the owner to share it with edit access.</div>'},10000);
 const db=await (window.claude&&claude.use?claude.use('db'):null);if(!db)return;
 ref=db.doc('laundry/state');chat=db.collection('chat');
 ref.onSnapshot(sn=>{clearTimeout(t);if(!sn.exists){ref.set(defaults()).catch(()=>{});return}S=sn.data();S.queue=S.queue||[];render()},()=>{$('#live').textContent='● Offline';$('#live').className='live off'});
 chat.orderBy('at','desc').limit(60).onSnapshot(sn=>{msgs=sn.docs.map(d=>d.data()).reverse();renderChat()});
})();
</script></body></html>
