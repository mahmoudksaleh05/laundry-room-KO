# fly launch --no-deploy --copy-config, then: fly volumes create suds_data --size 1 && fly deploy
app = "sudsqueue"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  TZ_NAME = "Europe/Berlin"

[mounts]
  source = "suds_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine, always on: timers and pushes run in-process (SQLite allows a single writer).
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
